<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slack Share Settings</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Slack Share</h1>
      <p class="subtitle">Share web pages to Slack</p>
    </header>

    <div class="tabs">
      <button class="tab-button active" data-tab="settings">Settings</button>
      <button class="tab-button" data-tab="history">History</button>
    </div>

    <main>
      <!-- Settings Tab -->
      <div id="settings-tab" class="tab-content active">
        <div class="form-group">
          <label for="webhook-url">
            Slack Webhook URL
            <span class="required">*</span>
          </label>
          <input 
            type="text" 
            id="webhook-url" 
            placeholder="https://hooks.slack.com/services/..."
            class="input-field"
          />
          <div class="help-text">
            <a href="https://api.slack.com/messaging/webhooks" target="_blank" rel="noopener">
              How to get a Webhook URL →
            </a>
          </div>
        </div>

        <div class="form-group">
          <label for="channel">
            Channel (Optional)
          </label>
          <input 
            type="text" 
            id="channel" 
            placeholder="#general or @username"
            class="input-field"
          />
          <div class="help-text">
            Leave empty to use the webhook's default channel
          </div>
        </div>

        <div class="form-group">
          <label for="button-position">
            Button Position
          </label>
          <select id="button-position" class="input-field">
            <option value="bottom-right">Bottom Right</option>
            <option value="bottom-left">Bottom Left</option>
            <option value="top-right">Top Right</option>
            <option value="top-left">Top Left</option>
          </select>
          <div class="help-text">
            Choose where the floating share button appears
          </div>
        </div>

        <div class="button-group">
          <button id="save-btn" class="btn btn-primary">Save Settings</button>
          <button id="test-btn" class="btn btn-secondary">Test Connection</button>
        </div>

        <div id="status-message" class="status-message"></div>
      </div>

      <!-- History Tab -->
      <div id="history-tab" class="tab-content">
        <div class="history-controls">
          <button id="export-btn" class="btn btn-small">Export CSV</button>
          <button id="clear-history-btn" class="btn btn-small btn-danger">Clear All</button>
        </div>
        
        <div id="history-list" class="history-list">
          <!-- History items will be populated here -->
        </div>
        
        <div id="empty-history" class="empty-state">
          <p>No shared items yet</p>
          <p class="help-text">Pages you share to Slack will appear here</p>
        </div>
      </div>
    </main>

    <footer>
      <div class="footer-links">
        <a href="https://github.com/yourusername/slack-share" target="_blank" rel="noopener">
          GitHub
        </a>
        <span class="separator">•</span>
        <a href="https://github.com/yourusername/slack-share/issues" target="_blank" rel="noopener">
          Report Issue
        </a>
      </div>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
